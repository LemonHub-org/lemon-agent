[agent]
work_dir = "./workspace"
scripts_dir = "./scripts"
db_path = "./agent.db"
max_steps = 200
max_input_tokens = 100000
max_llm_calls = 50
max_tool_calls = 200
max_wall_clock_secs = 86400
max_evolution_attempts = 5
max_context_tokens = 128000
heartbeat_interval_secs = 60
snapshot_interval_steps = 10
max_file_size_bytes = 10485760
command_timeout_secs = 120
loop_sleep_ms = 100

[llm]
# Provide the key via the AGENT_API_KEY environment variable; never commit it.
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4"
temperature = 0.7
request_timeout_secs = 60
max_retries = 3
retry_base_delay_secs = 1

[sandbox]
root_dir = "./workspace"
allowed_commands = ["git", "cargo", "rustc", "python3", "ls"]

[logging]
level = "info"
file = "agent.log"
