[package]
name = "lemon-agent"
version = "0.1.0"
edition = "2024"
description = "Unattended long-running autonomous programming agent with script-level self-evolution"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
notify = "8.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rhai = "1.25.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "sync", "signal"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.7.2"
serial_test = "4.0.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
